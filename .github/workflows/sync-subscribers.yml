name: Sync subscribers to CSV (DISABLED)

# ---------------------------------------------------------------------------
# DISABLED FOR PRIVACY.
# This repository is PUBLIC (required for Giscus comments), so subscriber
# email addresses must never be committed here. Get your subscriber CSV from
# the Buttondown dashboard instead: Subscribers -> Export.
#
# The daily schedule and the commit step have been removed so this job can no
# longer write subscriber data into the repo. Also disable it in the GitHub UI:
# Actions -> "Sync subscribers to CSV (DISABLED)" -> ... -> Disable workflow.
#
# If you ever want automatic desktop syncing again, it must target a PRIVATE
# repo (ask and it can be set up). The scripts/sync-subscribers.mjs helper is
# kept for that purpose.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch: {}

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This workflow is disabled for privacy."
          echo "Export subscribers from the Buttondown dashboard instead."
